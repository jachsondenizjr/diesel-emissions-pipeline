name: 'diesel_emissions'
version: '1.0.0'
profile: 'diesel_emissions'

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ── Limites regulatórios (g/kWh) ───────────────────────────────────────────────
# Fonte única de verdade para os modelos SQL.
# Valores devem espelhar config.yaml > regulatory_limits.
# Para alterar uma norma: edite config.yaml e atualize aqui.
vars:
  epa_tier4_nox_limit: 0.40
  epa_tier4_co_limit:  3.50
  epa_tier4_hc_limit:  0.19
  epa_tier4_pm_limit:  0.02
  euro6_nox_limit:     0.40
  euro6_co_limit:      4.00
  euro6_hc_limit:      0.16
  euro6_pm_limit:      0.01

# ── Materialização por camada ───────────────────────────────────────────────────
# staging (Silver): view — sempre reflete o Bronze atual, sem custo de storage
# marts   (Gold):   table — pré-computado para queries rápidas no Looker Studio
models:
  diesel_emissions:
    staging:
      +materialized: view
    marts:
      +materialized: table
